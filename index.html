<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fortale — AI Book, Story and Workbook Creator</title>
  <meta name="application-name" content="Fortale" />
  <meta name="description" content="Fortale is an AI-powered creative platform that turns ideas into illustrated, narrated, downloadable and shareable books, stories, fairy tales and workbooks." />
  <meta name="google-site-verification" content="ghutbyhoVuFKgIPwG0b39jS73JWyJZCZFAikdzRdf_Y" />
  <meta property="og:site_name" content="Fortale" />
  <meta property="og:title" content="Fortale — AI Book, Story and Workbook Creator" />
  <meta property="og:description" content="Create, discover, read, listen to, download and share illustrated books, stories, fairy tales and workbooks with Fortale." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: #030914;
    }
  </style>
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem('f-study-theme');
        const isDark = storedTheme === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
