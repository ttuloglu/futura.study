<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <style>
    .fortale-bar {
      transform-box: fill-box;
      transform-origin: center;
      animation: fortale-bar-wave 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .fortale-bar-col-1 { animation-delay: 0s; }
    .fortale-bar-col-2 { animation-delay: 0.15s; }
    .fortale-bar-col-3 { animation-delay: 0.30s; }
    .fortale-bar-col-4 { animation-delay: 0.45s; }
    .fortale-bar-col-5 { animation-delay: 0.60s; }

    @keyframes fortale-bar-wave {
      0%, 45%, 100% {
        transform: translateY(0);
        opacity: 0.92;
      }
      22% {
        transform: translateY(-40px) scale(1.04);
        opacity: 1;
        filter: brightness(1.25);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fortale-bar { animation: none; }
    }
  </style>
  <g transform="rotate(45 512 512)">
  <rect x="232" y="352" width="64" height="320" rx="32" fill="#FFFFFF" class="fortale-bar fortale-bar-col-1"/>
  <rect x="362" y="242" width="64" height="540" rx="32" fill="#FFFFFF" class="fortale-bar fortale-bar-col-2"/>
  <rect x="492" y="172" width="64" height="680" rx="32" fill="#c04235" class="fortale-bar fortale-bar-col-3"/>
  <rect x="622" y="242" width="64" height="540" rx="32" fill="#FFFFFF" class="fortale-bar fortale-bar-col-4"/>
  <rect x="752" y="352" width="64" height="320" rx="32" fill="#FFFFFF" class="fortale-bar fortale-bar-col-5"/>
  </g>
</svg>
